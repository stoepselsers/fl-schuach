<style>
:root{--bg0:#13161b;--bg1:#1c2027;--bg2:#262b34;--line:#0a0c0f;--fg:#dce1e8;--dim:#8c95a3;--acc:#ffa03f;--red:#ff5469;--lcd:#0b0e11;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg0) radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 0) 0 0/14px 14px;color:var(--fg);font:500 15px/1.4 "Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;display:grid;place-items:center;padding:16px}
form{width:min(360px,100%);background:var(--bg1);border:1px solid var(--line);border-radius:8px;box-shadow:0 20px 50px rgba(0,0,0,.6);overflow:hidden}
.head{display:flex;align-items:center;gap:10px;padding:14px 18px;background:linear-gradient(#313742,#262b34);border-bottom:1px solid var(--line)}
.head svg{width:40px;height:26px}
.head b{font-size:22px;letter-spacing:.01em}.head b span{color:var(--acc)}
.body{padding:18px;display:flex;flex-direction:column;gap:12px}
label{font:700 11px "Barlow Semi Condensed",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
input{height:40px;background:var(--lcd);border:1px solid var(--line);border-radius:4px;color:var(--fg);font:500 16px "JetBrains Mono",monospace;padding:0 12px}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
button{height:40px;border:0;border-radius:4px;background:var(--acc);color:var(--line);font:700 15px "Barlow Semi Condensed",sans-serif;letter-spacing:.06em;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:20px;font-size:14px;color:var(--red)}
.note{font-size:13px;color:var(--dim)}
</style>
